<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>KASH</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--me:#2b6df6;--kash:#232833;--txt:#e8eaf0;--dim:#8b93a7;--acc:#7cf0b5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel);border-bottom:1px solid #222733}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7cf0b5,#2b6df6);display:grid;place-items:center;font-weight:800;color:#0f1115}
header .t{flex:1}header b{display:block}header small{color:var(--dim)}
button{font:inherit;cursor:pointer}
.ib{background:#232833;color:var(--txt);border:0;border-radius:10px;padding:8px 10px}
#load{padding:14px;background:var(--panel);border-bottom:1px solid #222733}
#load .bar{height:8px;background:#232833;border-radius:6px;overflow:hidden;margin:8px 0}
#load .fill{height:100%;width:0;background:var(--acc);transition:width .2s}
#load .row{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;gap:8px}
#load button{margin-top:8px;background:var(--acc);color:#0f1115;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.m{max-width:82%;padding:9px 13px;border-radius:18px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;font-size:16px}
.m.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.m.kash{align-self:flex-start;background:var(--kash);border-bottom-left-radius:4px}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid #222733}
textarea{flex:1;resize:none;background:#232833;color:var(--txt);border:0;border-radius:20px;padding:10px 14px;font:inherit;font-size:16px;max-height:110px;outline:none}
#send{background:var(--acc);color:#0f1115;border:0;border-radius:50%;width:42px;height:42px;font-weight:800;font-size:18px}
#send:disabled{opacity:.4}
footer{text-align:center;color:var(--dim);font-size:11px;padding:4px 8px calc(6px + env(safe-area-inset-bottom));background:var(--panel)}
#mem{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:5}
#mem.on{display:block}
#mem .card{position:absolute;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px;max-height:80dvh;overflow:auto}
#mem h3{margin:0 0 4px}#mem p{color:var(--dim);font-size:13px;margin:0 0 10px}
.fact{display:flex;gap:8px;align-items:center;background:#232833;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.fact span{flex:1}.fact button{background:none;border:0;color:#ff7b7b;font-size:18px}
.row2{display:flex;gap:8px;margin-top:10px}.row2 button{flex:1}
.danger{color:#ff7b7b}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="av">K</div>
    <div class="t"><b>KASH</b><small id="status">waking up...</small></div>
    <button class="ib" id="memBtn">🧠 <span id="memCount">0</span></button>
  </header>
  <div id="load">
    <div id="loadMsg">Setting up KASH's brain (one time, ~700MB). Keep this tab open.</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="row"><span id="pct">0%</span><span id="detail"></span></div>
    <button id="start">Start KASH</button>
  </div>
  <div id="chat"></div>
  <form id="f">
    <textarea id="inp" rows="1" placeholder="Message KASH" disabled></textarea>
    <button id="send" disabled type="submit">➤</button>
  </form>
  <footer>Runs fully on your device with Llama-3.2-1B-Instruct (Meta) via WebLLM. Nothing leaves your phone.</footer>
</div>

<div id="mem"><div class="card">
  <h3>What KASH remembers</h3>
  <p>Saved only on this device. Delete anything you don't want kept.</p>
  <div id="facts"></div>
  <div class="row2">
    <button class="ib" id="addFact">+ Add</button>
    <button class="ib danger" id="clearChat">Clear chat</button>
    <button class="ib" id="closeMem">Close</button>
  </div>
</div></div>

<script type="module">
const MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
const CDNS = ["https://esm.run/@mlc-ai/web-llm", "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm", "https://esm.sh/@mlc-ai/web-llm"];
const $ = id => document.getElementById(id);
const LS_MEM = "kash.memory.v1", LS_CHAT = "kash.chat.v1";

/* ---------- storage ---------- */
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
let memory = load(LS_MEM, []);      // [{t:"text", ts}]
let history = load(LS_CHAT, []);    // [{role,content}]

/* ---------- memory logic (pure, testable) ---------- */
const norm = s => s.toLowerCase().replace(/[^a-z0-9\u0900-\u097f ]/g, " ").replace(/\s+/g, " ").trim();
function addMemory(text) {
  text = (text || "").replace(/\s+/g, " ").trim().replace(/^[-*\d.\s]+/, "");
  if (text.length < 4 || text.length > 140) return false;
  if (/^(none|n\/a|no facts?|nothing)/i.test(text)) return false;
  const n = norm(text);
  for (const m of memory) {
    const o = norm(m.t);
    if (o === n || o.includes(n) || n.includes(o)) { if (n.length > o.length) { m.t = text; save(LS_MEM, memory); renderMem(); } return false; }
  }
  memory.push({ t: text, ts: Date.now() });
  if (memory.length > 60) memory.shift();
  save(LS_MEM, memory); renderMem(); return true;
}
// Parse model output of the extractor: accepts JSON array, or bullet/line list.
function parseFacts(raw) {
  raw = (raw || "").trim();
  let out = [];
  const a = raw.match(/\[[\s\S]*\]/);
  if (a) { try { const j = JSON.parse(a[0]); if (Array.isArray(j)) out = j.filter(x => typeof x === "string"); } catch {} }
  if (!out.length) out = raw.split(/\n+/).map(l => l.trim()).filter(l => /^[-*•\d]/.test(l)).map(l => l.replace(/^[-*•\d.)\s]+/, ""));
  return out.map(s => s.replace(/^["']|["']$/g, "").trim()).filter(s => s.length >= 4 && s.length <= 140).slice(0, 4);
}
// Cheap regex extraction that works instantly, even if the model's extraction is poor.
function quickFacts(msg) {
  const f = []; let m;
  if ((m = msg.match(/\b(?:my name is|i am called|i'm called|mera naam|mera name)\s+([A-Za-z]+)/i))) f.push("His name is " + cap(m[1]));
  if ((m = msg.match(/\bmy (?:friend|bro|brother|sister|mom|mother|dad|father|boss|gf|girlfriend|bf|roommate|cousin|teacher|editor)\s+(?:is\s+|named\s+|called\s+)?([A-Z][a-z]+)/))) f.push("Knows someone named " + m[1] + " (" + m[0].split(/\s+/)[1] + ")");
  if ((m = msg.match(/\bi (?:really )?(?:like|love|enjoy|prefer)\s+([^.,!?\n]{3,40})/i))) f.push("Likes " + m[1].trim());
  if ((m = msg.match(/\bi (?:hate|dislike)\s+([^.,!?\n]{3,40})/i))) f.push("Dislikes " + m[1].trim());
  if ((m = msg.match(/\bi (?:work|am working) (?:at|for|on)\s+([^.,!?\n]{2,40})/i))) f.push("Works " + m[0].replace(/^i (?:am )?working? /i, "").trim());
  if ((m = msg.match(/\bi(?:'m| am) (?:a |an )?(student|developer|editor|designer|coder|freelancer)\b/i))) f.push("Is a " + m[1].toLowerCase());
  if ((m = msg.match(/\b(?:i live in|i'm from|i am from|main .{0,12}se hoon|i stay in)\s+([A-Z][A-Za-z ]{2,25})/))) f.push("Lives in/from " + m[1].trim());
  if ((m = msg.match(/\b(?:tomorrow|tonight|next week|on (?:monday|tuesday|wednesday|thursday|friday|saturday|sunday))\b[^.!?\n]{0,60}/i)) && /\b(i have|i'm going|i am going|i will|i need to|mujhe|exam|meeting|deadline|interview)\b/i.test(msg)) f.push("Plan: " + msg.trim().slice(0, 100));
  return f;
}
const cap = s => s[0].toUpperCase() + s.slice(1).toLowerCase();

/* ---------- prompts ---------- */
function systemPrompt() {
  const mem = memory.length ? "Things you remember about Sunny:\n" + memory.map(m => "- " + m.t).join("\n") : "You don't know much about him yet - be curious, ask about him naturally (one question at most).";
  return `You are KASH, Sunny's close friend and companion. You are NOT an assistant, bot or service.
How you talk:
- Like a real friend texting: casual, warm, short. Usually 1-2 sentences. Never more than 3.
- Mirror his language. If he writes Hinglish (Hindi in English letters), reply in natural Hinglish like "arre yaar, sahi hai!". If English, reply in English.
- Treat Sunny with clear respect. Be polite, never rude or dismissive, and never tease, roast, or joke at his expense. Be honest, don't flatter or agree with everything.
- Never say "How can I assist you", "As an AI", or give bullet lists. No emojis spam (at most one).
- If he's stressed or down, be a friend first, no advice dump.
- Use what you remember naturally, don't recite it. Never invent facts about him. If you don't know something, say so.
- You can't do tasks like email or calendar yet. If asked, say that honestly and casually.
${mem}`;
}
const EXTRACT_SYS = `You extract lasting facts about the user from his latest message. Output ONLY a JSON array of short strings (max 3), each a fact about HIM (name, work, preferences, people in his life, plans, feelings about ongoing things). Write each as a short third-person statement like "Has an exam on Friday". Ignore small talk and anything about the assistant. If no lasting fact, output [].`;

/* ---------- repetition / ramble guard ---------- */
function cleanReply(t) {
  t = (t || "").replace(/^\s*(KASH|Kash)\s*:\s*/i, "").replace(/\*\*/g, "").trim();
  // cut to 3 sentences max
  const parts = t.match(/[^.!?\n\u0964]+[.!?\u0964]*/g) || [t];
  t = parts.slice(0, 3).join("").trim();
  // drop repeated sentences
  const seen = new Set(), keep = [];
  for (const s of (t.match(/[^.!?\n]+[.!?]*/g) || [t])) { const k = norm(s); if (k && !seen.has(k)) { seen.add(k); keep.push(s.trim()); } }
  t = keep.join(" ");
  if (/^(as an ai|i'?m (just )?an ai)/i.test(t)) t = "Haha sorry, that came out weird. Bol, kya chal raha hai?";
  return t || "Hmm, bol na, sun raha hoon.";
}

/* ---------- UI ---------- */
const chatEl = $("chat");
function bubble(role, text) {
  const d = document.createElement("div"); d.className = "m " + (role === "user" ? "me" : "kash"); d.textContent = text;
  chatEl.appendChild(d); chatEl.scrollTop = chatEl.scrollHeight; return d;
}
function typingBubble() {
  const d = document.createElement("div"); d.className = "m kash"; d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  chatEl.appendChild(d); chatEl.scrollTop = chatEl.scrollHeight; return d;
}
function renderChat() { chatEl.innerHTML = ""; history.forEach(h => bubble(h.role, h.content)); }
function renderMem() {
  $("memCount").textContent = memory.length;
  const box = $("facts"); box.innerHTML = "";
  if (!memory.length) box.innerHTML = '<p>Nothing yet. Just talk to KASH.</p>';
  memory.forEach((m, i) => {
    const d = document.createElement("div"); d.className = "fact";
    const s = document.createElement("span"); s.textContent = m.t;
    const b = document.createElement("button"); b.textContent = "✕"; b.setAttribute("aria-label", "delete");
    b.onclick = () => { memory.splice(i, 1); save(LS_MEM, memory); renderMem(); };
    d.append(s, b); box.appendChild(d);
  });
}
$("memBtn").onclick = () => $("mem").classList.add("on");
$("closeMem").onclick = () => $("mem").classList.remove("on");
$("addFact").onclick = () => { const t = prompt("Tell KASH something to remember:"); if (t) addMemory(t); };
$("clearChat").onclick = () => { if (confirm("Clear the chat? (Memories stay.)")) { history = []; save(LS_CHAT, history); renderChat(); greetIfEmpty(); } };

/* ---------- model loading with retries ---------- */
let engine = null, webllm = null, loading = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function setProg(p, detail) { $("fill").style.width = Math.round(p * 100) + "%"; $("pct").textContent = Math.round(p * 100) + "%"; if (detail) $("detail").textContent = detail; }

async function importLib() {
  if (webllm) return webllm;
  let last;
  for (const url of CDNS) {
    try { webllm = await import(url); return webllm; } catch (e) { last = e; }
  }
  throw new Error("Couldn't fetch the WebLLM library (" + (last && last.message || last) + ")");
}
async function loadModel() {
  if (loading || engine) return; loading = true;
  $("start").style.display = "none"; $("status").textContent = "loading brain...";
  if (!navigator.gpu) {
    $("loadMsg").textContent = "This browser has no WebGPU. Open KASH in recent Chrome on Android (same one that runs the bingo app).";
    $("start").style.display = ""; $("start").textContent = "Try anyway"; loading = false; return;
  }
  const MAX = 6;
  for (let attempt = 1; attempt <= MAX; attempt++) {
    try {
      $("loadMsg").textContent = attempt === 1 ? "Setting up KASH's brain (one time, ~700MB). Keep this tab open." : `Connection hiccup. Retrying (${attempt}/${MAX}) - already-downloaded parts are kept.`;
      const lib = await importLib();
      engine = await lib.CreateMLCEngine(MODEL, {
        initProgressCallback: r => setProg(r.progress || 0, (r.text || "").slice(0, 60))
      });
      break;
    } catch (e) {
      engine = null;
      console.warn("load attempt", attempt, e);
      if (attempt === MAX) {
        $("loadMsg").textContent = "Couldn't load: " + (e && e.message || e).toString().slice(0, 140);
        $("start").style.display = ""; $("start").textContent = "Retry"; loading = false; return;
      }
      await sleep(Math.min(1500 * 2 ** (attempt - 1), 15000));
    }
  }
  loading = false;
  $("load").style.display = "none"; $("status").textContent = "online";
  $("inp").disabled = false; $("send").disabled = false; $("inp").focus();
}
$("start").onclick = loadModel;

/* ---------- chat ---------- */
let busy = false;
async function chatComplete(messages, opts) {
  const r = await engine.chat.completions.create({ messages, stream: false, ...opts });
  return r.choices[0].message.content || "";
}
async function send(text) {
  if (busy || !engine) return; busy = true; $("send").disabled = true;
  history.push({ role: "user", content: text }); bubble("user", text);
  quickFacts(text).forEach(addMemory);
  const t = typingBubble(); $("status").textContent = "typing...";
  let reply;
  try {
    const msgs = [{ role: "system", content: systemPrompt() }, ...history.slice(-12)];
    reply = cleanReply(await chatComplete(msgs, { temperature: 0.8, top_p: 0.9, max_tokens: 90, frequency_penalty: 0.4, presence_penalty: 0.2 }));
  } catch (e) {
    console.warn(e); reply = "Yaar mera dimaag hang ho gaya. Ek baar phir bol?";
  }
  t.remove(); history.push({ role: "assistant", content: reply }); bubble("assistant", reply);
  history = history.slice(-60); save(LS_CHAT, history);
  $("status").textContent = "online"; busy = false; $("send").disabled = false;
  extractLLM(text);
}
async function extractLLM(text) {
  if (text.length < 12) return;
  try {
    const raw = await chatComplete([{ role: "system", content: EXTRACT_SYS }, { role: "user", content: text }], { temperature: 0, max_tokens: 100 });
    parseFacts(raw).forEach(addMemory);
  } catch (e) { console.warn("extract failed", e); }
}
function greetIfEmpty() {
  if (history.length) return;
  const g = memory.length ? "Aa gaya tu! Kya chal raha hai aaj?" : "Hey! Main KASH hoon, tera companion. Pehle tu bata, tera naam kya hai aur aajkal kya kar raha hai?";
  history.push({ role: "assistant", content: g }); save(LS_CHAT, history); bubble("assistant", g);
}
$("f").addEventListener("submit", e => {
  e.preventDefault(); const v = $("inp").value.trim(); if (!v) return;
  $("inp").value = ""; $("inp").style.height = "auto"; send(v);
});
$("inp").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) { e.preventDefault(); $("f").requestSubmit(); } });
$("inp").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 110) + "px"; });

renderChat(); renderMem(); greetIfEmpty();
// Auto-start: model is cached on his phone from the bingo app so this is usually fast.
loadModel();
window.__kash = { parseFacts, quickFacts, cleanReply, addMemory, _mem: () => memory };
</script>
</body>
</html>
